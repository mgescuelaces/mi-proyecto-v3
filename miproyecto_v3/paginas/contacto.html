<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Escríbenos</h1>
    <form action="" method="post">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Escribe tu nombre" required />
      <br />
      <br />
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="pepito@correo.com" required/>
      <br /><br />
      <label for="telefono">Teléfono de contacto</label>
      <input type="tel" id="telefono" placeholder="+34999999" required />
      <br />
      <br />
      <label for="textarea" id="textarea">Comentarios</label>
      <br />
      <textarea
        name="textarea"
        id="textarea"
        cols="30"
        rows="10"
        placeholder="Dinos lo que piensas"
      ></textarea>
      <br />
      <button type="reset">Reset</button>
      <br />
<br />
<button type="submit">Enviar</button>

    </form>
  </body>
</html>
